version: '3.8'

services:
  docling-server:
    build: .
    container_name: docling-converter
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded figures
      - ./static/figures:/app/static/figures
      # Optional: Mount for development (uncomment for live reload)
      # - ./app:/app/app
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SERVER_URL=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
